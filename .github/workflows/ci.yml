name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm

      - name: Use the pinned npm release
        run: npm install --global npm@12.0.2

      - name: Install locked dependencies
        run: npm ci

      - name: Validate code, builds and dependency security
        run: npm run ci:validate
